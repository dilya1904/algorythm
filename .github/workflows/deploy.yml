name: Deploy BFS-DFS Maze Escape to Cloud Run

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: newproject-513100
  REGION: europe-west1
  SERVICE_NAME: bfs-dfs-maze
  GAR_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: europe-west1-docker.pkg.dev/newproject-513100/cloud-run-source-deploy/bfs-dfs-maze

jobs:
  deploy:
    name: Build & Deploy BFS-DFS Maze API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Cloud Authentication (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        working-directory: server
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --port=8080
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Smoke Test Deployed Service
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Deployed Service URL: $URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "Health check HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Smoke test failed! Expected HTTP 200, got $HTTP_STATUS"
            exit 1
          fi
          echo "Smoke test passed successfully!"
